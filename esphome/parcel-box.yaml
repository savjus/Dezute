substitutions:
  device_name: parcel-box
  friendly_name: Siuntu dezute
  wifi_ssid: 
  wifi_password: ""
  mqtt_broker: 1
  mqtt_topic: parcel-box

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  platformio_options:
    board_build.flash_mode: dio

esp32:
  board: esp32dev
  framework:
    type: arduino

logger:

api:

ota:
  - platform: esphome

wifi:
  ssid: ${wifi_ssid}
  password: ${wifi_password}
  ap:
    ssid: "${friendly_name} Fallback"
    password: "change-this-password"

mqtt:
  broker: ${mqtt_broker}
  topic_prefix: ${device_name}
  birth_message:
    topic: ${mqtt_topic}/status
    payload: online
  will_message:
    topic: ${mqtt_topic}/status
    payload: offline

i2c:
  sda: GPIO21
  scl: GPIO22
  scan: true

output:
  - platform: ledc
    id: lock_servo_output
    pin: GPIO18
    frequency: 50 Hz

servo:
  - id: lock_servo
    output: lock_servo_output
    min_level: 2.5%
    idle_level: 7.5%
    max_level: 12.5%

switch:
  - platform: gpio
    id: unlock_led
    pin: GPIO15

  - platform: template
    name: "${friendly_name} Atrakinti"
    id: unlock_box
    optimistic: true
    turn_on_action:
      - servo.write:
          id: lock_servo
          level: 100%
      - switch.turn_on: unlock_led
    turn_off_action:
      - servo.write:
          id: lock_servo
          level: -100%
      - switch.turn_off: unlock_led

binary_sensor:
  # M5Stack Core button A is connected to GPIO39 and is active low.
  - platform: gpio
    name: "${friendly_name} M5Stack A mygtukas"
    id: m5stack_button_a
    pin:
      number: GPIO39
      mode:
        input: true
      inverted: true
    filters:
      - delayed_on: 20ms
      - delayed_off: 20ms
    on_press:
      - mqtt.publish:
          topic: ${mqtt_topic}/pressed
          payload: '{"button":"A","event":"pressed"}'

  - platform: gpio
    name: "${friendly_name} Durelės"
    id: door
    pin:
      number: GPIO4
      mode:
        input: true
        pullup: true
      inverted: true
    device_class: door
    on_press:
      - mqtt.publish:
          topic: ${mqtt_topic}/door
          payload: open
    on_release:
      - mqtt.publish:
          topic: ${mqtt_topic}/door
          payload: closed

sensor:
  - platform: ultrasonic
    name: "${friendly_name} Atstumas"
    id: parcel_distance
    trigger_pin: GPIO5
    echo_pin: GPIO19
    update_interval: 5s
    unit_of_measurement: cm
    accuracy_decimals: 1
    filters:
      - multiply: 100
    on_value:
      then:
        - if:
            condition:
              lambda: "return x > 0 && x <= 35;"
            then:
              - mqtt.publish:
                  topic: ${mqtt_topic}/content
                  payload: full
            else:
              - if:
                  condition:
                    lambda: "return x > 35;"
                  then:
                    - mqtt.publish:
                        topic: ${mqtt_topic}/content
                        payload: empty

display:
  - platform: lcd_pcf8574
    dimensions: 16x2
    address: 0x27
    update_interval: 1s
    lambda: |-
      it.printf(0, 0, "Siuntu dezute");
      it.printf(0, 1, "Dist: %.1f cm", id(parcel_distance).state);
