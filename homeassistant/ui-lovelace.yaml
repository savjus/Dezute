title: Siuntu dezute
views:
  - title: Apzvalga
    path: overview
    icon: mdi:package-variant-closed
    cards:
      - type: button
        name: Sugeneruoti kodą kurjeriui
        icon: mdi:form-textbox-password
        entity: script.siuntu_dezute_generuoti_koda
        tap_action:
          action: call-service
          service: script.turn_on
          target:
            entity_id: script.siuntu_dezute_generuoti_koda
      - type: entity
        entity: input_text.siuntu_dezute_kodas
        name: Aktyvus kurjerio kodas
        icon: mdi:key
      - type: entities
        title: Kodo galiojimas
        show_header_toggle: false
        entities:
          - entity: binary_sensor.siuntu_dezute_kodas_aktyvus
            name: Kodas aktyvus
          - entity: sensor.siuntu_dezute_kodo_liko
            name: Likęs laikas
      - type: entities
        title: Dėžutės būsena
        show_header_toggle: false
        entities:
          - entity: binary_sensor.siuntu_dezute_dureles
            name: Durelės
          - entity: binary_sensor.siuntu_dezute_uzrakinta
            name: Užrakinta
          - entity: binary_sensor.siuntu_dezute_siunta_dezuteje
            name: Siunta dėžutėje
          - entity: sensor.siuntu_dezute_dezutes_turinys
            name: Dėžutės turinys
      - type: entity
        entity: counter.siuntu_dezute_klaidos
        name: Neteisingi bandymai
        icon: mdi:counter
      - type: markdown
        content: >-
          Paspausk „Sugeneruoti kodą kurjeriui“. Kodas bus rodomas šiame
          skydelyje ir Home Assistant pranešimuose. Jis galioja 5 minutes.
